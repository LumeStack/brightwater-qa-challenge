<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice | Brightwater Billing Portal</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="invoice">
<div class="bw-layout">
  <aside class="bw-sidebar"><div class="bw-brand">Brightwater</div><nav class="bw-nav" aria-label="Main"></nav></aside>
  <main class="bw-content">
    <p><a href="/invoices">Back to invoices</a></p>
    <h1 class="bw-title">Invoice</h1>
    <div class="bw-skeleton" aria-busy="true">Loading invoice</div>

<script src="/assets/app.js"></script>
